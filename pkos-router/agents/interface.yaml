interface:
  display_name: "出口路由决策"
  short_description: "v4.0 策略消费者：读取 Policy Engine 的 Execution Strategy 校验后分发，产出路由单 YAML"
  default_prompt: "Use $pkos-router when the user asks 做成什么好 / HTML 还是 PPT."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
