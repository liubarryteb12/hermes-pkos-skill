# 失败三态回归测试 — pkos.analysis.structure
# Schema: pkos-test:1
# 对应 v2 契约 C-4：沉默规则/关联推荐/写回防护的失败三态拆解
# B5 强化：多次分析累加语义明确化

meta:
  capability: pkos.analysis.structure
  schema: pkos-test:1
  version: 1.0.0

cases:

  # ----------------- not_found：v0 沉默规则的合法路径 -----------------
  - id: analysis-silence-low-confidence
    failure_mode: not_found
    description: 低置信度线索 → v0 沉默规则 → v2 解释 not_found（合法不产出）
    arrange:
      target: { by_path_pattern: "entries/<domain>/sparse-clue.md" }
    act: analyze
    assert:
      - "AN-* 仍落盘（'零发现'是合法发现）"
      - "发现表为 0 条"
      - "v2_failure_mode == 'not_found'"
      - "无 fail 报告给用户（continue + report 摘要）"

  - id: analysis-clean-content
    failure_mode: not_found
    description: 源已完美无瑕 → 直说干净不硬找 → not_found
    arrange:
      target: { by_path_pattern: "entries/<domain>/clean.md" }
      env_mocks: { "ai_smell_score": 0, "structure_issues": 0 }
    act: analyze
    assert:
      - "AN-* 落盘"
      - "发现表 0 条"
      - "AN 中明示'内容干净'（按 v0 锁死）"

  - id: analysis-no-associations
    failure_mode: not_found
    description: 域内无候选关联（库内未存相关概念）→ 推荐列表空 → not_found
    arrange:
      target: { by_path_pattern: "entries/<niche>/isolated.md" }
      env_mocks: { "vault_index_no_match": true }
    act: analyze
    assert:
      - "AN-* 跨域关联推荐段为空列表"
      - "不报错（vault_index 无候选合法）"
      - "v2_failure_mode == 'not_found'（业务事实：库内无候选）"

  - id: analysis-own-product-empty
    failure_mode: not_found
    description: own-product 模式 + 源无核心要点 → not_found
    arrange:
      target: { by_path_pattern: "entries/<domain>/own.md" }
      options: { mode: "own-product" }
    act: analyze
    assert:
      - "跳过发现表（v0 own-product 行为）"
      - "AN 包含'要点为空'明示"

  # ----------------- ambiguous：约束不足挂起 -----------------
  - id: analysis-missing-frontmatter
    failure_mode: ambiguous
    description: 源条目 front matter 缺 type/domain/status → 无法决定透镜 → ambiguous
    arrange:
      target: { by_path_pattern: "entries/broken.md" }
      env_mocks: { "front_matter_complete": false, "missing": ["type", "domain"] }
    act: analyze
    assert:
      - "result.v2_failure_mode == 'ambiguous'"
      - "decision_card 列出缺失字段"
      - "不强行产出 AN（等补字段）"

  - id: analysis-re-analyze-existing
    failure_mode: ambiguous
    description: re_analyze=true + 源已有 analyzed + AN-* 已存在 → 合并/并列/覆盖 决策
    arrange:
      target: { by_path_pattern: "entries/<domain>/re-do.md" }
      options: { re_analyze: true }
      env_mocks: { "existing_an": ["AN-2026-08-20-x", "AN-2026-08-25-x"] }
    act: analyze
    assert:
      - "result.v2_failure_mode == 'ambiguous'"
      - "decision_card 含三选项（合并/并列/覆盖）"
      - "不自动覆盖既有 AN 列表"

  - id: analysis-association-dup-target
    failure_mode: ambiguous
    description: 跨域关联推荐时同一目标被多引用 → 去重待用户裁
    arrange:
      target: { by_path_pattern: "entries/<domain>/multi-ref.md" }
      env_mocks: { "vault_index_dup_candidates": true }
    act: analyze
    assert:
      - "result.v2_failure_mode == 'ambiguous'"
      - "decision_card 列出冲突目标"

  # ----------------- unavailable：技术不可达 -----------------
  - id: analysis-vault-index-missing
    failure_mode: unavailable
    description: vault_index 缺失或过期 → 不可健康分析
    arrange:
      target: { by_path_pattern: "entries/<domain>/x.md" }
      env_mocks: { "vault_index_available": false }
    act: analyze
    assert:
      - "result.v2_failure_mode == 'unavailable'"
      - "不强行产出（分析需要索引）"
      - "abort + 报告：先建 vault_index"

  - id: analysis-source-unreadable
    failure_mode: unavailable
    description: 源条目 IO 故障（锁/权限/不存在）
    arrange:
      target: { by_path_pattern: "entries/<domain>/locked.md" }
      env_mocks: { "dir_acl": "deny-read" }
    act: analyze
    assert:
      - "result.v2_failure_mode == 'unavailable'"
      - "evidence.traceback != null"
      - "retry 3 轮后 abort"

  - id: analysis-writeback-fail
    failure_mode: unavailable
    description: 写回源条目 front matter 失败（integrity_policy 强约束）
    arrange:
      target: { by_path_pattern: "entries/<domain>/readonly.md" }
      env_mocks: { "file_locked": true }
    act: analyze
    assert:
      - "AN-* 仍可落盘（输出端 OK）"
      - "写回源条目 front matter 失败 → unavailable"
      - "rollback: AN-* 标 'uncommitted'，不视为入库完成"

  # ----------------- success + B5 写回防护 -----------------
  - id: analysis-success-standard
    failure_mode: success
    description: 标准成功分析 → AN 落盘 + 源 front matter 追加 + diff 证明正文零改动
    arrange:
      target: { by_path_pattern: "entries/<domain>/standard.md" }
    act: analyze
    assert:
      - "AN-* 6 段齐全（含 CONSTRAINT_NOTE 段非空）"
      - "核心要点 ≤ 7 条"
      - "源 front matter 追加了 05-pkos-analysis 与 status=analyzed"
      - "源正文一字未改（diff 证明）"
      - "CONSTRAINT NOTE 段非空"

  - id: analysis-success-b5-accumulate
    failure_mode: success
    description: B5 强化：多次分析 → 05-pkos-analysis 字段累加成 YAML 列表，不覆盖
    arrange:
      target: { by_path_pattern: "entries/<domain>/re-analyzed.md" }
      env_mocks:
        "existing_pkos_analysis": ["AN-2026-08-20-a", "AN-2026-08-25-b"]
    act: analyze
    assert:
      - "源 front matter.05-pkos-analysis 现在是 3 项列表（既有 2 + 新 1）"
      - "既有 AN 引用未被删除"
      - "diff 显示仅追加，无覆盖"

  - id: analysis-success-association-resolved
    failure_mode: success
    description: 跨域关联推荐全部解析到现存笔记 → 无悬空链接
    arrange:
      target: { by_path_pattern: "entries/<domain>/linked.md" }
    act: analyze
    assert:
      - "AN 跨域关联推荐每条 target 路径都 exists_in_vault"
      - "无悬空链接（v0 强约束）"
