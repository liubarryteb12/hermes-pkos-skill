<!doctype html>
<html lang="zh-CN" data-style="night-desk">
<head><meta charset="utf-8"><title>night-desk preview</title>
<style>
:root{--bg:#15171c;--ink:#c9ccd3;--ink-soft:#7d828e;--accent:#d9a05b;--line:#2b2f38;--card:#1d2026}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.9}
.pk-article{max-width:40rem;margin:0 auto;padding:48px 26px}
.pk-title{font-family:'Noto Sans SC',sans-serif;font-size:1.8em;text-align:center;margin:0 0 .4em}
.pk-subtitle{text-align:center;color:var(--ink-soft);font-size:.9em;margin:0 0 3em}
.pk-h2{font-family:'Noto Sans SC',sans-serif;border-bottom:1px solid var(--line);padding-bottom:.4em;margin:2.6em 0 1em}
.pk-h2 .pk-no{color:var(--accent);margin-right:.55em}
.pk-h3{font-family:'Noto Sans SC',sans-serif;margin:1.7em 0 .6em}
.pk-callout{background:var(--card);border-left:3px solid var(--accent);padding:.85em 1.2em;margin:1.4em 0}
ol.pk-steps li::marker{color:var(--accent);font-weight:700}
table.pk-zebra{border-collapse:collapse;width:100%}
table.pk-zebra th{background:var(--card);text-align:left;padding:.5em .8em}
table.pk-zebra tr:nth-child(even) td{background:var(--card)}
ul.pk-dash{list-style:none;padding-left:1.2em}
ul.pk-dash li::before{content:"·";color:var(--ink-soft);margin-right:.6em}
code{background:var(--card);padding:.1em .35em;border-radius:3px}
.pk-meta{color:var(--ink-soft);font-size:.76em;border-top:1px solid var(--line);padding-top:1em;margin-top:4.5em}
</style></head>
<body>
<main class="pk-article">
  <h1 class="pk-title" data-block="h1_title_center">区块预览：夜案</h1>
  <p class="pk-subtitle" data-block="subtitle">暗色长文 · 琥珀锚点预算 ≤5 处</p>

  <h2 class="pk-h2" data-block="h2_section_rule"><span class="pk-no">01</span>章节标题（规则线）</h2>
  <p data-block="p_body">正文段落：冷灰衬线，低亮度不刺眼。琥珀只出现在章节编号、步骤序号、链接悬停。</p>

  <blockquote class="pk-callout" data-block="blockquote_callout_card">
    <p>引用块：卡片底色 + 琥珀左边线。放关键命题或代码引文。</p>
  </blockquote>

  <h2 class="pk-h2" data-block="h2_second"><span class="pk-no">02</span>操作步骤（实战指南专用）</h2>
  <ol class="pk-steps" data-block="ol_path_steps">
    <li>第一步：琥珀序号是锚点之一</li>
    <li>第二步：命令用行内代码 <code>pkos build</code></li>
    <li>第三步：每篇 ol 至多两个</li>
  </ol>

  <table class="pk-zebra" data-block="table_zebra">
    <tr><th>参数</th><th>说明</th></tr>
    <tr><td>--check</td><td>只比对不写入</td></tr>
    <tr><td>--out</td><td>输出路径</td></tr>
  </table>

  <ul class="pk-dash" data-block="ul_dash_list">
    <li>无序列表：间隔号引导</li>
    <li>零散备注专用</li>
  </ul>

  <p class="pk-meta" data-block="meta_footer">PKOS · night-desk · route=… · source=…</p>
</main>
</body>
</html>
